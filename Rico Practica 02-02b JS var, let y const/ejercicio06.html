<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    <script>
        document.write("Esto es una cadena de texto: ", typeof "Esto es una cadena de texto" + "<br>")
        document.write("Esto es un número: ", typeof 23 + "<br>")
        document.write(typeof true + "<br>")
        document.write(typeof null + "<br>")
        document.write(typeof {nombre: "Raquel", edad: 19} + "<br>")
        document.write(typeof [1, 2, 3] + "<br>")
        document.write(typeof function saludar() {} + "<br>")
    </script>
</body>
</html>
