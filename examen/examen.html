<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        table {
            border-collapse: collapse;
            margin: 1rem 0;

            border: 1px solid #ccc;

</head>
<body>
    <h1>Izan Rico Blanco</h1>

    <h2>Ejercicio 1</h2>
    <script>
        const num1 = Number.parseInt(prompt("Ingresa el primer número: "), 10);
        const num2 = Number.parseInt(prompt("Ingresa el segundo número: "), 10);
        const num3 = Number.parseInt(prompt("Ingresa el tercer número: "), 10);

        if (
            Number.isNaN(num1) || Number.isNaN(num2) || Number.isNaN(num3) ||
            !Number.isInteger(num1) || !Number.isInteger(num2) || !Number.isInteger(num3)
        ) {
            document.write("Algún número ingresado no es válida.<br>");
        } else {
            const resultado = (num1 * num2 + num3) * num3;
            document.write(resultado);
        }
    </script>

    <h2>Ejercicio 2</h2>
    <script>
        const var1 = 1;
        const var2 = "hola";
        const var3 = true;
        let nota;
        const var4 = null;
        const var5 = 12345678901234567890n;
        const persona1 = { nombre: "Manuel", edad: 19 };
        const ciudades = ["Málaga", "Sevilla", "Cádiz"];

        function saludo() {
            return "hola";
        }

        document.write("Tipo: ", typeof var1, "<br>");
        document.write("Tipo: ", typeof var2, "<br>");
        document.write("Tipo: ", typeof var3, "<br>");
        document.write("Tipo: ", typeof nota, "<br>");
        document.write("Tipo: ", typeof var4, "<br>");
        document.write("Tipo: ", typeof var5, "<br>");
        document.write("Tipo: ", typeof persona1, "<br>");
        document.write("Tipo: ", typeof ciudades, "<br>");
        document.write("Tipo: ", typeof saludo, "<br>");
        document.write("¿Es un objeto?: ", persona1 instanceof Object, "<br>");
        document.write("¿Es un array?: ", ciudades instanceof Array, "<br>");
        document.write("¿Es una función?: ", typeof saludo === "function", "<br>");
    </script>

    <h2>Ejercicio 3</h2>
    <script>
        const mes = Number(prompt("Ingresa el mes (1-12): "));
        const filosofo = (mes === 1) ? "Aristóteles" :
            (mes === 2) ? "Platón" :
            (mes === 3) ? "San Agustín" :
            (mes === 4) ? "Santo Tomás" :
            (mes === 5) ? "Descartes" :
            (mes === 6) ? "Rousseau" :
            (mes === 7) ? "Locke" : "No coincide con ningún filósofo.";

        document.write(filosofo, "<br>");
    </script>

    <h2>Ejercicio 4</h2>
    <script>
        const nume1 = Number(prompt("Ingresa el primer número: "));
        const nume2 = Number(prompt("Ingresa el segundo número: "));
        const operador = prompt("Ingresa la operación (AND, OR, XOR, DIZQ o DDER): ")
            .trim()
            .toUpperCase();

        if (!Number.isInteger(nume1) || !Number.isInteger(nume2)) {
            document.write("Debes ingresar dos números enteros.");
        } else if ((operador === "DIZQ" || operador === "DDER") && (nume2 < 0 || nume2 > 31)) {
            document.write("Para desplazar, el segundo número debe estar entre 0 y 31.");
        } else {
            let resultado;

            switch (operador) {
                case "AND":
                    resultado = nume1 & nume2;
                    break;
                case "OR":
                    resultado = nume1 | nume2;
                    break;
                case "XOR":
                    resultado = nume1 ^ nume2;
                    break;
                case "DIZQ":
                    resultado = nume1 << nume2;
                    break;
                case "DDER":
                    resultado = nume1 >> nume2;
                    break;
                default:
                    document.write("Operación no reconocida.");
                    break;
            }

            if (resultado !== undefined) {
                const binario = (resultado >>> 0).toString(2).padStart(32, "0");
                document.write(`Resultado decimal: ${resultado}<br>`);
                document.write(`Resultado binario (32 bits): ${binario}`);
            }
        }
    </script>

    <h2>Ejercicio 5</h2>
    <script>
        const opcion = Number(prompt("Ingresa un número entre 1 y 10: "));

        switch (opcion) {
            case 1:
            case 2:
            case 3:
                document.write("Números pequeños.<br>");
                break;
            case 4:
            case 5:
                document.write("La opción es mayor o igual que 5.<br>");
                break;
            case 6:
                document.write("La opción es mayor o igual que 5.<br>");
                document.write("La opción es mayor o igual que 6.<br>");
                break;
            case 7:
                document.write("La opción es mayor o igual que 5.<br>");
                document.write("La opción es mayor o igual que 6.<br>");
                document.write("La opción es mayor o igual que 7.<br>");
                break;
            case 8:
                document.write("Número 8.<br>");
                break;
            case 9:
                document.write("Número 9.<br>");
                break;
            case 10:
                document.write("Número 10.<br>");
                break;
            default:
                document.write("Error.<br>");
                break;
        }
    </script>

    <h2>Ejercicio 6</h2>
    <script>
        const colores = ["#f25", "#f50", "#f85", "#F11", "#F36", "#fA5", "#f5B", "#f25", "#f50", "#f85", "#F11"];
        const i = Number(prompt("Ingresa el número positivo que quieras: "));

        if (i < 0) {
            document.write("El número introducido es negativo.<br>");
        }

        document.write("<table>");

        for (let fila = 0; fila < i; fila++) {
            document.write("<tr>");

            for (let indice = 0; indice < i; indice++) {
                const color = colores[indice % colores.length];
                document.write(`<td bgcolor="${color}" width="40" height="40">${indice + 1}</td>`);
            }

            document.write("</tr>");
        }

        document.write("</table>");
    </script>

    <h2>Ejercicio 9</h2>

            ["vacía", "mina", "vacía", "vacía", "vacía"],
            ["vacía", "vacía", "mina", "vacía", "mina"],
            ["mina", "vacía", "vacía", "vacía", "vacía"],

        for (let i = 0; i < tablero.length; i++) {
