    <h2>Ejercicio 4</h2>

    <script>
        const nume1 = Number(prompt("Ingresa el primer número: "));
        const nume2 = Number(prompt("Ingresa el segundo número: "));
        const operador = prompt("Ingresa la operacón (AND, OR, XOR, DIZQ o DDER): ")
        .trim().toUpperCase();

        if (!Number.isInteger(num1) || !Number.isInteger(num2)) {
            document.write("Debes ingresar dos números enteros.");
        } else if (
            (operacion === "DIZQ" || operacion === "DDER") &&
            (num2 < 0 || num2 > 31)
        ) {
            document.write("Para desplazar, el segundo número debe estar entre 0 y 31.");
        } else {
            let resultado;

        switch (operacion) {
            case "AND":
            resultado = num1 & num2;
            break;
            case "OR":
            resultado = num1 | num2;
            break;
            case "XOR":
            resultado = num1 ^ num2;
            break;
            case "DIZQ":
            resultado = num1 << num2;
            break;
            case "DDER":
            resultado = num1 >> num2;
            break;
            default:
            document.write("Operación no reconocida.");
        }

        if (resultado !== undefined) {
            const binario = (resultado >>> 0).toString(2).padStart(32, "0");

            document.write(`Resultado decimal: ${resultado}<br>`);
            document.write(`Resultado binario (32 bits): ${binario}`);
        }
        }
        
    </script>

    <h2>Ejercicio 6</h2>

    <script>
        var colores=["#f25","#f50","#f85","#F11","#F36","#fA5","#f5B","#f25","#f50","#f85","#F11"]
        const i = Number(prompt("Ingresa el número positivo que quieras: "));
        

        if (i < 0){
            document.write("El número introducido es menegativo.", "<br>");
            
        }
        
        
        document.write(`<table>`);
                

        for(let valor = 0; valor < i; valor++){
            document.write(`<tr>`);

            for(let indice = 0; indice < i; indice++){
                const color = colores[indice % colores.length];
                document.write(`<td bgcolor ="${color}" width = "40" height = "40">${indice + 1}</td>`);

            }

            document.write(`</tr>`);

        }

        document.write(`</table>`);
        
        

    </script>
