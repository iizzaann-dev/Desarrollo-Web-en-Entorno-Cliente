<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 26</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 26</h2>
    <script>
        
        const num1 = Number(prompt("Ingresa el primer número: "));

        const num2 = Number(prompt("Ingresa el segundo número: "));

        const operador = prompt("Ingresa el operador que quieras (+, -, *, /)");
        
        let resultado = 0;

        switch (operador) {
            case "+":
                resultado = num1 + num2;
                document.write(resultado);
                break;
        
            case "-":
                resultado = num1 - num2;
                document.write(resultado);
                break;

            case "*":
                resultado = num1 * num2;
                document.write(resultado);
                break;

            case "/":
                resultado = num1 / num2;
                document.write(resultado);
                break;

            default:
                document.write("El operador escogido no es válido", "<br>");
                
                break;
        }
        
    </script>
</body>
</html>
