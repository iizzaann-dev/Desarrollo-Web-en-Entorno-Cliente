<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class = "titulo_ejercicios">Ejercicio 10</h2>

    <script>
        const num1 = prompt("Ingresa el primer número:")
        const num2 = prompt("Ingresa el segundo número: ")

        if (num1 < num2){
            document.write("El segundo número es mayor que el primero", "<br>");
            
        }else if (num2 < num1){
            document.write("El primer número es mayor que el segundo", "<br>");
            
        }else{
            document.write("Los números son iguales", "<br>");
            
        }
    </script>
</body>
</html>
