<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class = "titulo_ejercicios">Ejercicio 6</h2>

    <script>
        const anio = parseInt(prompt("Ingresa un año: "))

        if (anio % 400 == 0 || (anio % 4 == 0 && anio % 100 != 0)){
            document.write("Este año es bisiesto.", "<br>");
            
        }else{
            document.write("Este año no es bisiesto.", "<br>");
            
        }
    </script>
</body>
</html>
