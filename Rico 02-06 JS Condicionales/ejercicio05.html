<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>

    <h2 class = "titulo_ejercicios">Ejercicio 5</h2>
    
    <script>

        const edad = prompt("Ingresa tu edad: ");

        if(edad < 18){
            document.write("Eres menor")
        }else if(edad >= 18){
            document.write("Estás en edad activa")
        }else if (edad > 67){
            document.write("Estás jubilado")
        }
    </script>
</body>
</html>
