<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 20</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 20</h2>
    <script>
        const num1 = Number(prompt("Ingresa el primer número: "));
        const num2 = Number(prompt("Ingresa el segundo número: "));

        let resultado = num1 > num2 ? "El primer número es mayor que el segundo."
        : "El segundo número es mayor que el primero.";
        
        document.write("El primer número es: ", num1, "<br>");
        document.write("El segundi número es: ", num2 , "<br>");
        

        document.write(resultado);
    </script>
</body>
