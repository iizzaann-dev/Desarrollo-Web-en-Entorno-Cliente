<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 18</h2>
    <script>
        const numero = prompt("Ingresa un número: ");

        let resultado = numero % 2 == 0 ? 
        "El número " + numero + " es par" :
        "El número " + numero + " es impar";
        
        document.write(resultado);
        
    </script>
</body>
