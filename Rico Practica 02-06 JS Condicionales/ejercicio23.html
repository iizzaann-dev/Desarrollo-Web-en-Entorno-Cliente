<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 23</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 23</h2>
    <script>
        const numero = Number(prompt("Ingresa un número real: "));

        if(numero < 0){
            document.write("El número es negativo.", "<br>");
        }else if(numero > 0){
            document.write("El número es positivo.", "<br>");
        }else{
            document.write("El número es 0.", "<br>");
            
        }
        
    </script>
</body>
</html>
