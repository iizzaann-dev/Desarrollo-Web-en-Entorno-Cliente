<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 25</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 25</h2>
    <script>
        
        const dia = prompt("Ingresa un día de la semana: ");

        switch (dia.toLowerCase()) {
            case "lunes":
                document.write("1", "<br>");
                break;
            
            case "martes":
                document.write("2", "<br>");
                break;

            case "miercoles":
                document.write("3", "<br>");
                break;
            
            case "jueves":
                document.write("4", "<br>");
                break;

            case "viernes":
                document.write("5", "<br>");
                break;

            case "sábado":
                document.write("6", "<br>");
                break;

            case "sabado":
                document.write("6", "<br>");
                break;

            case "domingo":
                document.write("7", "<br>");
                break;
                
            default:
                break;
        }
        
    </script>
</body>
</html>
