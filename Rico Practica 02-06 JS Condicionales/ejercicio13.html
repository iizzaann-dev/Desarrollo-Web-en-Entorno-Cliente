<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-06 JS Condicionales</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 13</h2>
    <script>
        const nombre1 = prompt("Ingresa el primer nombre: ");
        const nombre2 = prompt("Ingresa el segundo nombre: ");

        if(nombre1[0] == nombre2[0] || nombre1[nombre1.length - 1] == nombre2[nombre2.length - 1]){
            document.write("Coincidencia", "<br>");
            
        }else{
            document.write("No hay coincidencia", "<br>");
            
        }
        
        
    </script>
</body>
</html>
