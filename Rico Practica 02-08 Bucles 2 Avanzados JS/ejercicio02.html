<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio0 2</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-08 Bucles 2 Avanzados JS</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 02</h2>
    <script>
        
        const lista = ["Malaga", "Sevilla", "Cordoba", "Huelva", "Cadiz", "Almeria", "Granada"];

        for (let i = 0; i < lista.length; i++) {
            const verde = Math.round((i / (lista.length - 1)) * 255)
            .toString(16)
            .padStart(2, "0");

            const color = `#00${verde}00`;
            document.write(`<span style="color: ${color};">${lista[i]}</span><br>`);
        }
    </script>
</body>
</html>
