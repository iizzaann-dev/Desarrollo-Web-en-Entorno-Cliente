<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio0 9</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>02-08 Bucles 2 Avanzados JS</h1>
    <h2>Izan Rico Blanco</h2>
    <h2 class="titulo_ejercicios">Ejercicio 09</h2>
    <script>
        let lista1 = [
            ["magenta", "magenta", "magenta", "magenta", "magenta", "magenta"],
            ["yellow", "yellow", "magenta", "magenta", "yellow", "yellow"],
            ["yellow", "cyan", "cyan", "cyan", "cyan", "yellow"],
            ["yellow", "yellow", "magenta", "magenta", "yellow", "yellow"],
            ["magenta", "magenta", "magenta", "magenta", "magenta", "magenta"]
        ];

        document.writeln(`<table width='400px' height='300px' border='0'cellpadding=0 cellspacing=0>`);

        for(let i = 0; i < lista1.length; i++){
            document.write(`<tr>`);
            
            for(let j = 0; j < lista1[i].length; j++){
                document.write(`<td style = "background-color: ${lista1[i][j]};"></td>`);
                
            }
            document.write(`</tr>`);
        }
        
        document.writeln("</tr> </table> ");
    </script>
</body>
</html>
