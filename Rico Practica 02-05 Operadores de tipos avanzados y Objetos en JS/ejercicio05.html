<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Uso de las llaves {} en JavaScript</h1>

    <h2>1. Crear un objeto</h2>
    <script>
        let persona = {
            nombre: "Raquel",
            edad: 19
        };

        document.write("Nombre: " + persona.nombre + "<br>");
        document.write("Edad: " + persona.edad + "<br>");
    </script>

    <h2>2. Delimitar un bloque de código</h2>
    <script>
        let edad = 20;

        if (edad >= 18) {
            document.write("Es mayor de edad.");
        }
    </script>

    <h2>3. Crear una función</h2>
    <script>
        function saludar() {
            document.write("<br>¡Hola!");
        }

        saludar();
    </script>
</body>
</html>
