<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Ejemplo de objetos en JavaScript</h1>

    <script>
        var arrayb = {
            elem1: "Santiago",
            elem2: "Coruña",
            elem3: "Lugo"
        };

        document.write(arrayb["elem3"]);
    </script>

    <h2>Explicación</h2>

    <p>
        <strong>var arrayb:</strong> crea un objeto con tres propiedades:
        elem1, elem2 y elem3.
    </p>

    <p>
        <strong>arrayb["elem3"]:</strong> accede a la propiedad elem3
        del objeto y obtiene su valor.
    </p>
</body>
</html>
