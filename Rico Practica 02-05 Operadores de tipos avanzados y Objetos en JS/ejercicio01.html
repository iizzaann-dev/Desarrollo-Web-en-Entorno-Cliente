<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <h1>Operador punto (.)</h1>

    <p>Permite acceder a las propiedades y métodos de un objeto.</p>

    <script>
        // Acceder a una propiedad
        let persona = {
            nombre: "Raquel",
            edad: 19
        };

        document.write("Nombre: " + persona.nombre + "<br>");
        document.write("Edad: " + persona.edad + "<br>");

        // Acceder a un método
        let texto = "Hola mundo";

        document.write("Longitud del texto: " + texto.length + "<br>");
        document.write("Texto en mayúsculas: " + texto.toUpperCase());
    </script>
</body>
</html>
