<body>

    <h1>Ejercicio 7</h1>

    <script>
        // AND (&&) combinado con paréntesis
        document.write("(true && true) && false = " + ((true && true) && false) + "<br>");

        // OR (||) combinado con paréntesis
        document.write("(true || false) || false = " + ((true || false) || false) + "<br>");

        // NOT (!) combinado con paréntesis
        document.write("!(true && false) = " + (!(true && false)) + "<br>");
    </script>
</body>
