<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>

    <h1>Ejercicio 3</h1>

    <table>
        <tr>
            <th>Operador</th>
            <th>Nombre</th>
            <th>Ejemplo</th>
        </tr>

        <tr>
            <td>&&</td>
            <td>AND logico (Y)</td>
            <td>true && false -> false</td>
        </tr>

        <tr>
            <td>||</td>
            <td>OR lógico (O)</td>
            <td>true || false -> true</td>
        </tr>

        <tr>
            <td>!</td>
            <td>NOT lógico (NO)</td>
            <td>!true -> false</td>
        </tr>

    </table>
</body>
</html>
