<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Ejercicio 6</h1>

    <script>
        // Operador AND (&&)
        document.write("true && false = " + (true && false) + "<br>");

        // Operador OR (||)
        document.write("true || false = " + (true || false) + "<br>");

        // Operador NOT (!)
        document.write("!true = " + (!true) + "<br>");
    </script>
</body>
</html>
