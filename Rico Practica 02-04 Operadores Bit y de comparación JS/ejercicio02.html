<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <script>
        // Asignación (=)
            let a = 10;
            document.write("a = 10 → " + a + "<br>");

            // Asignación de suma (+=)
            let b = 10;
            b += 5;
            document.write("b += 5 → " + b + "<br>");

            // Asignación de resta (-=)
            let c = 10;
            c -= 5;
            document.write("c -= 5 → " + c + "<br>");

            // Asignación de multiplicación (*=)
            let d = 10;
            d *= 5;
            document.write("d *= 5 → " + d + "<br>");

            // Asignación de división (/=)
            let e = 10;
            e /= 5;
            document.write("e /= 5 → " + e + "<br>");

            // Asignación de resto (%=)
            let f = 10;
            f %= 3;
            document.write("f %= 3 → " + f + "<br>");

            // Asignación de desplazamiento a la izquierda (<<=)
            let g = 10;
            g <<= 1;
            document.write("g <<= 1 → " + g + "<br>");

            // Asignación de desplazamiento a la derecha (>>=)
            let h = 10;
            h >>= 1;
            document.write("h >>= 1 → " + h + "<br>");

            // Asignación de desplazamiento a la derecha sin signo (>>>=)
            let i = 10;
            i >>>= 1;
            document.write("i >>>= 1 → " + i + "<br>");

            // Asignación AND bit a bit (&=)
            let j = 10;
            j &= 5;
            document.write("j &= 5 → " + j + "<br>");

            // Asignación OR bit a bit (|=)
            let k = 10;
            k |= 5;
            document.write("k |= 5 → " + k + "<br>");

            // Asignación XOR bit a bit (^=)
            let l = 10;
            l ^= 5;
            document.write("l ^= 5 → " + l + "<br>");

            // Asignación de un elemento de un array (no existe el operador []=)
            let array = [10, 20, 30];
            array[0] = 5;
            document.write("array[0] = 5 → " + array[0] + "<br>");
    </script>
</body>
</html>
